<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            border: 2px solid;
            margin: 80px;
            padding: 20px;
            width: 800px;
        }
        .avatar{
            border: 1px solid black;
            box-sizing: border-box;
            width: 64px;
            height: 64px;
            position: relative;
            margin: 40px;
            border-radius: 50px;
        }
        .badge{
            border-radius: 50%;
            width: 20px;
            text-align: center;
            background: red;
            position: absolute;
            top: -8px;
            right: -8px;
        }
        img{
            width: 100%;
            height:100%;
            border-radius: 50px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="body">
        <h1>Module 1.1</h1>
        <div class="avatar">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSW_r2rqe1_1Kxn3sBOGbFhffbGgKmDsLU8zry7KpjP-Q&s=10"/>
            <div class="badge">3</div>
        </div>
    </div>
</body>
</html>
